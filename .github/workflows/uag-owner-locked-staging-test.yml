# No Cloudflare account access, no credentials, no deployment, no business data.
name: UAG Owner-Locked Staging Gate
on:
  push:
    branches:
      - research/uag-cloudflare-free-staging-20261110
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uag-owner-locked-staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owner-locked-staging:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify owner-approved D1-bound inert staging configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tomllib
          c=tomllib.loads(Path("cloud_host/wrangler.toml").read_text())
          assert c.get("name")=="windows-native-validation-free"
          assert c.get("main")=="worker.mjs"
          assert c.get("workers_dev") is True
          assert c.get("d1_databases") == [{
            "binding": "DB",
            "database_name": "uag-staging-queue",
            "database_id": "1b393fb4-7699-470d-8a78-5ef1d2af06c7"
          }]
          assert not any(k in c for k in ("vars","routes","route","triggers","durable_objects","kv_namespaces","services","queues","r2_buckets"))
          w=Path("cloud_host/worker.mjs").read_text()
          assert 'status:"no_public_capabilities"' in w
          assert 'OWNER_PUBLIC_KEY_B64' in w and 'OWNER_POLICY_SIGNATURE_B64' in w
          print("OWNER_LOCKED_STAGING_D1_BINDING_GUARD_PASSED")
          PY
      - name: Validate signed owner policy and denied operations with synthetic identities
        run: node --test cloud_host/worker.test.mjs
      - name: Validate D1 policy schema locally
        run: python cloud_host/check_schema.py
      - name: Confirm no Cloudflare deployment credentials are used
        run: echo "OWNER_LOCKED_STAGING_OFFLINE_ONLY_NO_DEPLOYMENT"
      - name: Verify already owner-deployed staging endpoint from hosted runner
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://windows-native-validation-free.dlevtonyuk.workers.dev'
          # Only public, unauthenticated GET requests. No credentials or writes.
          curl -fsS --max-time 20 --retry 2 --retry-delay 1 "$endpoint/health" | python -c 'import sys,json; d=json.load(sys.stdin); assert d=={"service":"universal-gateway","status":"no_public_capabilities"}, "Unexpected public health contract"'
          missing=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$endpoint/v1/enable")
          test "$missing" = 404
          # Without configured device tokens, the public Worker deliberately
          # returns 503, before signature/DB checks; this is fail-closed.
          denied=$(curl -sS --max-time 15 -o /tmp/uag-claim-denied.json -w '%{http_code}' "$endpoint/v1/device/claim?device=office_pc")
          test "$denied" = 503
          python -c 'import json; d=json.load(open("/tmp/uag-claim-denied.json")); assert d=={"error":"device_tokens_unconfigured"}, "Unexpected device-denial response"'
          echo 'LIVE_OWNER_LOCKED_GATEWAY_HEALTH_PROBE_PASSED'
