# Isolated, no-secret feature-branch test only. No deployment step.
name: UAG Policy Rollback Research
on:
  push:
    branches:
      - research/uag-policy-rollback-20261108
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uag-policy-rollback-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-policy-test:
    if: ${{ github.event.repository.private == false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unit tests with ephemeral synthetic grant keys
        run: node --test cloud_host/worker.test.mjs
      - name: Check D1 SQLite schema
        run: python cloud_host/check_schema.py
      - name: Generic gateway safety and device adapter tests
        run: python -m unittest discover -s gateway_tests -q
      - name: Probe Microsoft read-only WMI provider-host attribution on disposable Windows
        if: ${{ matrix.os == 'windows-2025' }}
        shell: pwsh
        run: |
          $result = & ./tests/Test-Wmi-ProviderMapping.ps1 | ConvertFrom-Json
          if ($result.provenance -ne 'DISPOSABLE_GITHUB_WINDOWS_HOST_NOT_USER_PC') { throw 'INVALID_PROVENANCE' }
          if ($result.provider_query_state -eq 'QUERY_SUPPORTED' -and -not $result.provider_host_pid_field) { throw 'INVALID_WMI_PID_PROJECTION' }
          Write-Host ('WMI_PROVIDER_MAP_TEST: ' + ($result | ConvertTo-Json -Compress))
      - name: Read-only WMI provider operation delta and PID mapping fixture
        if: ${{ matrix.os == 'windows-2025' }}
        shell: pwsh
        run: |
          $providers=@(Get-CimInstance -Namespace root\cimv2 -ClassName MSFT_Providers -ErrorAction Stop)
          $hosts=@(Get-CimInstance -ClassName Win32_Process -Filter "Name='WmiPrvSE.exe'" -ErrorAction Stop)
          $ids=@{}; foreach($h in $hosts){$ids[[string]$h.ProcessId]=$true}
          $match=@($providers | Where-Object {
            $null -ne $_.HostProcessIdentifier -and $ids.ContainsKey([string]$_.HostProcessIdentifier)
          } | Select-Object -First 1)
          if($match.Count -eq 0) {throw 'NO_RUNNING_WMI_PROVIDER_TO_TEST'}
          $pidTarget=[int]$match[0].HostProcessIdentifier
          $r=& ./tests/Get-WmiProviderHostEvidence.ps1 -TargetPid $pidTarget -SampleSeconds 1 | ConvertFrom-Json
          if($r.schema -ne 1 -or -not $r.read_only -or $r.target_pid -ne $pidTarget -or $r.provider_count -lt 1) {throw 'WMI_READONLY_MAPPING_VALIDATION_FAILED'}
          if(@($r.providers).Count -ne $r.provider_count) {throw 'WMI_PROVIDER_COUNT_MISMATCH'}
          Write-Host ('WMI_TARGETED_READ_ONLY_PROVIDER_PROBE_PASSED: count='+$r.provider_count+', event_status='+$r.recent_event_status)



  cloudflare-engine-offline:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler in disposable runner only
        run: npm install --no-save --ignore-scripts wrangler@4.158.0
      - name: Apply schema with actual local Cloudflare D1 engine
        run: npx wrangler d1 execute DB --local --config cloud_host/wrangler.lab.toml --file cloud_host/schema.sql --yes
      - name: Verify actual local D1 policy revision table
        run: |
          npx wrangler d1 execute DB --local --config cloud_host/wrangler.lab.toml --command "SELECT id,highest_revision,payload_sha256 FROM owner_policy_state" --json
      - name: Verify real local workerd enforces no owner activation
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 --config cloud_host/wrangler.lab.toml --var SUBMIT_TOKEN:synthetic-public-offline-ci-token-00000001 > /tmp/uag-local-workerd.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for n in $(seq 1 35); do
            if curl --max-time 2 -fsS http://127.0.0.1:8787/health -o /tmp/uag-health.json; then ready=1; break; fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then cat /tmp/uag-local-workerd.log; exit 1; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/uag-local-workerd.log; exit 1; fi
          grep -q '"no_public_capabilities"' /tmp/uag-health.json
          code=$(curl --max-time 3 -s -o /tmp/uag-denied.json -w '%{http_code}' -X POST http://127.0.0.1:8787/v1/jobs -H 'Content-Type: application/json' -d '{"job_id":"lab_001"}')
          test "$code" = 401
          grep -q '"unauthorized"' /tmp/uag-denied.json
          code=$(curl --max-time 3 -s -o /tmp/uag-signed-disabled.json -w '%{http_code}' -X POST http://127.0.0.1:8787/v1/jobs -H 'Content-Type: application/json' -H 'Authorization: Bearer synthetic-public-offline-ci-token-00000001' -d '{"job_id":"lab_001"}')
          test "$code" = 503
          grep -q '"owner_activation_not_configured"' /tmp/uag-signed-disabled.json
          echo 'OFFLINE_WORKER_DENY_BY_DEFAULT_OK'
      - name: Real local workerd signed grants, revocation and rollback
        run: node cloud_host/test_workerd_integration.mjs
