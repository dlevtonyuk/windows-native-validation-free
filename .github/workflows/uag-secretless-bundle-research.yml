name: UAG deterministic secretless release artifact research
on:
  push:
    branches:
      - research/uag-owner-isolated-release-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle-without-cloudflare-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned Wrangler installation (no dependency lifecycle scripts)
        run: npm install --no-save --ignore-scripts wrangler@4.158.0
      - name: Secret-free Worker compile and artifact manifest
        shell: bash
        run: |
          set -eu
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          mkdir -p "$RUNNER_TEMP/uag-bundle"
          npx wrangler versions upload --dry-run --config cloud_host/wrangler.d1.pending.toml --outdir "$RUNNER_TEMP/uag-bundle"
          echo "UAG_BUNDLE_ARTIFACTS"
          find "$RUNNER_TEMP/uag-bundle" -maxdepth 4 -type f -print -exec sha256sum {} \;
          test -n "$(find "$RUNNER_TEMP/uag-bundle" -maxdepth 4 -type f \( -name '*.js' -o -name '*.mjs' \) -print -quit)"
          echo "UAG_BUNDLE_ARTIFACTS_END"
          mkdir -p "$RUNNER_TEMP/uag-second-build"
          npx wrangler versions upload --dry-run --config cloud_host/wrangler.d1.pending.toml --outdir "$RUNNER_TEMP/uag-second-build"
          cmp "$RUNNER_TEMP/uag-bundle/worker.js" "$RUNNER_TEMP/uag-second-build/worker.js"
          echo "SAME_SOURCE_BYTE_FOR_BYTE_REPRODUCIBLE_BUNDLE"
