name: UAG deterministic secretless release artifact research
on:
  push:
    branches:
      - research/uag-owner-isolated-release-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle-without-cloudflare-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned Wrangler installation (no dependency lifecycle scripts)
        run: npm install --no-save --ignore-scripts wrangler@4.158.0
      - name: Secret-free Worker compile and artifact manifest
        shell: bash
        run: |
          set -eu
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          mkdir -p artifact-output
          npx wrangler versions upload --dry-run --config cloud_host/wrangler.d1.pending.toml --outdir artifact-output
          echo "UAG_BUNDLE_ARTIFACTS"
          find artifact-output -maxdepth 2 -type f -print -exec sha256sum {} \;
          echo "UAG_BUNDLE_ARTIFACTS_END"
