# Windows-lag research only. No installation, changes to user PC or private uploads.
name: Windows Lag Read-only Process Attribution
on:
  push:
    branches:
      - research/windows-lag-readonly-20261110
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-lag-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  read-only-windows:
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm disposable Windows runner
        shell: pwsh
        run: |
          if($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'NOT_DISPOSABLE_HOSTED_WINDOWS'
          }
      - name: Validate short-interval CPU, handle, thread and provider attribution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r=& ./tests/ReadOnly-SystemPressureAttribution.ps1 -TargetPids $PID -MaxProcesses 25 -SampleSeconds 1 | ConvertFrom-Json
          if(-not $r.read_only -or $r.schema -ne 1 -or $r.elapsed_seconds -lt 0.75) { throw 'READONLY_SCHEMA_INVALID' }
          if(@($r.process_data).Count -lt 1){throw 'PROCESS_RESULTS_MISSING'}
          $rows=@($r.process_data | Where-Object { $_.pid -eq $PID })
          if($rows.Count -ne 1){throw 'OWN_PROCESS_NOT_FOUND'}
          $self=$rows[0]
          if($self.handles -lt 1 -or $self.threads -lt 1 -or $self.private_mb -lt 1){throw 'PROCESS_COUNTERS_INVALID'}
          if($null -ne $self.cpu_percent_total_capacity -and
             ($self.cpu_percent_total_capacity -lt 0 -or $self.cpu_percent_total_capacity -gt 100)){
            throw 'CPU_TOTAL_CAPACITY_CALIBRATION_INVALID'
          }
          if(@('AVAILABLE','UNAVAILABLE_OR_TIMEOUT','NOT_REQUESTED') -notcontains $r.provider_mapping_status){
            throw 'WMI_PROVIDER_MAP_STATUS_INVALID'
          }
          # Never print provider identity or private process data to a public log.
          Write-Host ('READONLY_ATTRIBUTION_FIXTURE_PASSED: n='+@($r.process_data).Count+', wmi='+$r.provider_mapping_status)
      - name: Validate WMI-free native RAM and bounded process CPU diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r=& ./tests/ReadOnly-LowOverheadCapture.ps1 -SampleSeconds 1 -MaxGroups 20 | ConvertFrom-Json
          if($r.schema -ne 1 -or !$r.read_only -or !$r.no_cim_wmi_queries){throw 'LIGHT_DIAG_CONTRACT_INVALID'}
          if($r.ram_total_gb -lt 1 -or $r.ram_used_pct -lt 0 -or $r.ram_used_pct -gt 100){throw 'LIGHT_DIAG_MEMORY_INVALID'}
          if($r.enumerated_processes -lt 1 -or @($r.groups).Count -lt 2){throw 'LIGHT_DIAG_PROCESS_INVALID'}
          if($r.actual_cpu_sample_seconds -lt 0.85 -or $r.actual_cpu_sample_seconds -gt 7){throw 'LIGHT_DIAG_CPU_WINDOW_INVALID'}
          if(@($r.groups|Where-Object {$_.private_mb -lt 0 -or $_.working_mb -lt 0 -or $_.process_count -le 0}).Count -ne 0){throw 'LIGHT_DIAG_GROUP_INVALID'}
          Write-Host ('WMI_FREE_NATIVE_RAM_CAPTURE_PASSED: groups='+@($r.groups).Count+', runtime_seconds='+$r.execution_elapsed_seconds)
      - name: Validate legacy Windows PowerShell 5.1 compatibility
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSVersion.Major -ne 5){throw 'EXPECTED_LEGACY_POWERSHELL_51'}
          $r=& .\tests\ReadOnly-LowOverheadCapture.ps1 -SampleSeconds 1 -MaxGroups 20 | ConvertFrom-Json
          if($r.schema -ne 1 -or -not $r.no_cim_wmi_queries -or -not $r.read_only){throw 'LEGACY_CONTRACT_INVALID'}
          if($r.ram_total_gb -lt 1 -or $r.ram_used_pct -lt 0 -or $r.ram_used_pct -gt 100){throw 'LEGACY_MEMORY_INVALID'}
          if(@($r.groups).Count -lt 2){throw 'LEGACY_GROUPS_MISSING'}
          if($r.execution_elapsed_seconds -gt 12){throw 'LEGACY_SAMPLER_TOO_SLOW_ON_DISPOSABLE_RUNNER'}
          Write-Host ('WINDOWS_POWERSHELL_51_WMI_FREE_CAPTURE_PASSED: seconds='+$r.execution_elapsed_seconds)
      - name: Validate WMI provider PID mapping under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $providerRows=@(Get-CimInstance -Namespace root\cimv2 -ClassName MSFT_Providers -ErrorAction Stop)
          $hosts=@(Get-CimInstance -ClassName Win32_Process -Filter "Name='WmiPrvSE.exe'" -ErrorAction Stop)
          $ids=@{};foreach($hostProcess in $hosts){$ids[[string]$hostProcess.ProcessId]=$true}
          $matched=@($providerRows | Where-Object {
            $null -ne $_.HostProcessIdentifier -and $ids.ContainsKey([string]$_.HostProcessIdentifier)
          } | Select-Object -First 1)
          if($matched.Count -lt 1){throw 'NO_RUNNING_PROVIDER_PID_MAPPING_FOUND'}
          $targetPid=[int]$matched[0].HostProcessIdentifier
          $result=& .\tests\ReadOnly-SystemPressureAttribution.ps1 -TargetPids $targetPid -MaxProcesses 20 -SampleSeconds 1 | ConvertFrom-Json
          if(-not $result.read_only -or $result.schema -ne 1){throw 'WMI_READONLY_LEGACY_CONTRACT_INVALID'}
          if($result.provider_mapping_status -ne 'AVAILABLE'){throw 'WMI_PROVIDER_LEGACY_MAP_UNAVAILABLE'}
          $present=@($result.wmi_providers | Where-Object {$_.host_pid -eq $targetPid})
          if($present.Count -lt 1){throw 'WMI_PROVIDER_TARGET_NOT_MAPPED'}
          Write-Host ('WINDOWS_POWERSHELL_51_WMI_PROVIDER_MAPPING_PASSED: matched='+$present.Count)




      - name: Validate WMI-free PID-level background pressure trends (PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $r=& .\tests\ReadOnly-BackgroundPressureTrend.ps1 -ProcessNames powershell -SampleSeconds 1 -MaxProcesses 10 | ConvertFrom-Json
          if($r.schema -ne 1 -or -not $r.read_only -or -not $r.no_wmi){throw 'BG_TREND_CONTRACT_INVALID'}
          if($r.matched_pid_count -lt 1){throw 'BG_TREND_PROCESS_MISSING'}
          $self=@($r.processes | Where-Object { $_.pid -eq $PID })
          if($self.Count -ne 1){throw 'BG_TREND_SELF_MISSING'}
          if($self[0].threads -lt 1 -or $self[0].handles -lt 1 -or -not $self[0].stable_pid_and_start_time) {throw 'BG_TREND_PID_VALIDATION_INVALID'}
          if($null -ne $self[0].cpu_percent_total_capacity -and ($self[0].cpu_percent_total_capacity -lt 0 -or $self[0].cpu_percent_total_capacity -gt 100)){throw 'BG_TREND_CPU_INVALID'}
          Write-Host ('WINDOWS_51_BG_PRESSURE_TREND_PASSED: processes='+$r.matched_pid_count)
      - name: Validate WMI-free PID-level trend in modern PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r=& ./tests/ReadOnly-BackgroundPressureTrend.ps1 -ProcessNames pwsh -SampleSeconds 1 -MaxProcesses 10 | ConvertFrom-Json
          if($r.schema -ne 1 -or -not $r.read_only -or -not $r.no_wmi){throw 'MODERN_BG_TREND_CONTRACT_INVALID'}
          $self=@($r.processes | Where-Object { $_.pid -eq $PID })
          if($self.Count -ne 1){throw 'MODERN_BG_TREND_SELF_MISSING'}
          Write-Host ('POWERSHELL_7_BG_PRESSURE_TREND_PASSED: processes='+$r.matched_pid_count)
