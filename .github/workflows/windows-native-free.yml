# Staging template only. This is deliberately outside .github/workflows/
# so the existing private repository cannot start a Windows runner.
# Publish only generic, nonconfidential tests to a separately approved
# public repository; publishing any production files is prohibited.
name: Free Public Windows Native Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-native-free.yml'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-free-windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-windows:
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Check out generic tests without retaining credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert public-only / GitHub-hosted Windows
        shell: pwsh
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if ($env:REPO_PRIVATE -ne 'false') { throw 'PUBLIC_ONLY_TEST_REFUSED' }
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') { throw 'NOT_HOSTED_WINDOWS_RUNNER' }
      - name: Validate native Windows APIs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\Test-WindowsNative.ps1
      - name: Validate simulated trace ownership
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\Test-OwnershipRecovery.ps1
      - name: Validate read-only process, RAM and WMI service correlation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP ('pressure-'+[guid]::NewGuid().ToString('N')+'.json')
          & .\tests\ReadOnly-Pressure.ps1 -SuspectPids $PID -OutFile $path
          $r = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          if ($r.schema -ne 1 -or $r.process_count -lt 1 -or @($r.top_handles).Count -lt 1) { throw 'RESOURCE_PRESSURE_STRUCTURE_INVALID' }
          if ($r.ram.used_pct -lt 0 -or $r.ram.used_pct -gt 100) { throw 'RESOURCE_PRESSURE_RAM_INVALID' }
          Remove-Item -LiteralPath $path -Force
          Write-Host 'RESOURCE_PRESSURE_PROBE_PASSED'
      - name: Validate official Windows runner release and SHA-256 metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\Check-RunnerRelease.ps1 -ProbeOnly
      - name: Verify zero-cost private runner bootstrap package without registration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\bootstrap\Bootstrap-PrivateWindowsRunner.ps1 -Mode VerifyPackage
      - name: Verify real isolated WMI and WPR trace lifecycle plus crash recovery
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\Test-IsolatedCapture.ps1
      - name: Fail-safe cleanup of any owned test trace
        if: ${{ always() && github.event.repository.private == false }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter 'capturev6-*' -ErrorAction SilentlyContinue | ForEach-Object {
            if (Test-Path (Join-Path $_.FullName 'trace-ownership.json')) {
              & .\tests\Invoke-IsolatedCapture.ps1 -Mode Recover -Root $_.FullName
            }
          }
