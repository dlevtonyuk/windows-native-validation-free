# Owner-release ledger consistency and replay denial: public synthetic research ONLY.
# No owner keys, credentials, production deployments or Cloudflare writes.
name: UAG owner ledger fail-closed integrity research
on:
  push:
    branches: [research/uag-owner-isolated-release-20261112]
    paths:
      - 'cloud_host/owner_release_ledger.py'
      - 'cloud_host/test_owner_release_ledger.py'
      - 'cloud_host/owner_release_guard.mjs'
      - 'cloud_host/owner_release_guard.test.mjs'
      - '.github/workflows/uag-owner-ledger-integrity-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-release-integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real SQLite release-ledger consistency and replay denial
        run: python -m unittest discover -s cloud_host -p test_owner_release_ledger.py -v
      - name: Signed owner approval integration with durable local ledger
        run: node --test cloud_host/owner_release_verifier.test.mjs cloud_host/owner_release_guard.test.mjs
      - name: Assert no deployment secrets are supplied
        shell: bash
        run: |
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          echo 'UAG_OFFLINE_OWNER_LEDGER_INTEGRITY_ONLY'
