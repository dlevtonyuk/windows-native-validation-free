# Read-only/no-secret external proof of owner-approved live staging Worker.
name: UAG Validate Live Inert Owner Stage
on:
  push:
    branches:
      - research/uag-staging-owner-stage-candidate-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-safe-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify public health and fail-closed admin route, without writes
        shell: bash
        run: |
          set -euo pipefail
          base='https://windows-native-validation-free.dlevtonyuk.workers.dev'
          health_status=$(curl --retry 2 --retry-delay 1 --max-time 18 -sS -o /tmp/uag-live-health.json -w '%{http_code}' "$base/health")
          echo "Health HTTP $health_status"
          test "$health_status" = 200
          python -c 'import json; assert json.load(open("/tmp/uag-live-health.json"))=={"service":"universal-gateway","status":"no_public_capabilities"}'
          # A POST with no Access identity must be rejected before any SQL or signature validation.
          status=$(curl -sS --retry 2 --retry-delay 1 --max-time 18 -o /tmp/owner-stage-denial.json -w '%{http_code}' -X POST "$base/owner/policy/stage" -H 'Content-Type: application/json' -d '{}')
          echo "Owner staging unauthenticated HTTP $status"
          test "$status" = 403
          python -c 'import json; assert json.load(open("/tmp/owner-stage-denial.json"))=={"error":"owner_access_required"}'
          status=$(curl -sS --retry 2 --retry-delay 1 --max-time 18 -o /dev/null -w '%{http_code}' -X POST "$base/v1/jobs" -H 'Content-Type: application/json' -d '{}')
          echo "Job unauthenticated HTTP $status"
          test "$status" = 401
          # Avoid curl's intermittent HTTP 503 response write error (exit 23).
          python - <<'PY'
          from urllib.request import urlopen
          from urllib.error import HTTPError
          endpoint='https://windows-native-validation-free.dlevtonyuk.workers.dev/v1/device/claim?device=office_pc'
          try:
              response=urlopen(endpoint,timeout=18)
              raise AssertionError('Unexpected device claim response '+str(response.status))
          except HTTPError as e:
              print('Device unauthenticated HTTP',e.code)
              assert e.code==503
          PY
          echo 'LIVE_OWNER_STAGE_EXTERNAL_DENY_BY_DEFAULT_VERIFIED'
