name: UAG free foundation preflight (offline)
on:
  push:
    branches: [research/uag-owner-isolated-release-20261112]
    paths:
      - 'research/universal_dispatch/**'
      - '.github/workflows/uag-free-foundation-preflight-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-account-capacity-and-security:
    if: ${{ github.event.repository.private == false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict no-deployment capacity and protected-effects regression tests
        run: node --test research/universal_dispatch/free_host_preflight.test.mjs
      - name: Ensure no Cloudflare token or deployment instructions are used
        shell: bash
        run: |
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          echo 'UAG_FREE_FOUNDATION_RESEARCH_ONLY'
