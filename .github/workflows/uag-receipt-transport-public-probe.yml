name: UAG public receipt transport smoke test (no secrets)
on:
  push:
    branches:
      - research/uag-owner-isolated-release-20261112
    paths:
      - .github/workflows/uag-receipt-transport-public-probe.yml
permissions:
  contents: read
  id-token: write
jobs:
  public-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Cloudflare public readiness and GitHub OIDC JWKS
        shell: bash
        run: |
          set -uo pipefail
          echo "PROBE_START"
          for u in 'https://uag-owner-signed-receipts.dlevtonyuk.workers.dev/health' 'https://token.actions.githubusercontent.com/.well-known/jwks'; do
            code=$(curl --silent --show-error --location --max-time 12 --output /tmp/uag_response --write-out '%{http_code}' "$u")
            result=$?
            if [[ $result -ne 0 ]]; then echo "PROBE_TRANSPORT_FAILED curl_exit=$result"; exit 1; fi
            if [[ "$code" != "200" ]]; then echo "PROBE_HTTP_FAILED code=$code"; exit 1; fi
            if ! python3 -m json.tool /tmp/uag_response > /dev/null; then echo 'PROBE_INVALID_JSON'; exit 1; fi
            echo "PROBE_OK http=$code"
          done
          echo "PROBE_SUCCEEDED"
      - name: Verify OIDC fetch and intentional rejection of wrong repository (no credentials logged)
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const api=process.env.ACTIONS_ID_TOKEN_REQUEST_URL, access=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if(!api||!access)throw Error('OIDC_ENV_UNAVAILABLE');
          const url=new URL(api);url.searchParams.set('audience','uag-owner-receipts-v1');
          const auth=await fetch(url,{headers:{Authorization:'bearer '+access},signal:AbortSignal.timeout(10000)});
          if(!auth.ok)throw Error('OIDC_FETCH_ERROR_'+auth.status);
          const jwt=(await auth.json()).value;
          if(typeof jwt!=='string')throw Error('OIDC_INVALID_VALUE');
          const r=await fetch('https://uag-owner-signed-receipts.dlevtonyuk.workers.dev/v1/receipt',{method:'POST',headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},body:JSON.stringify({probe_status:'success'}),signal:AbortSignal.timeout(15000)});
          if(r.status!==401)throw Error('UNEXPECTED_RECEIVER_STATUS_'+r.status);
          const b=await r.json();if(b.reason!=='unauthorized')throw Error('UNEXPECTED_RECEIVER_BODY');
          process.stdout.write('OIDC_TRANSPORT_OK_BAD_REPOSITORY_REJECTED_401\n');
          JS
      - name: Verify resilient reporter emits only sanitized wrong-repo rejection
        shell: bash
        env:
          UAG_PROBE_STATUS: success
        run: |
          set +e
          node ./research/trusted_runner/owner_signed_receipt_20261118_classified.mjs > /tmp/uag_reporter.out 2>&1
          result=$?
          set -e
          if [[ $result -ne 1 ]]; then echo "UNEXPECTED_REPORTER_EXIT=$result"; exit 1; fi
          if ! grep -qx 'SIGNED_RECEIPT_ERROR:RECEIPT_HTTP_401' /tmp/uag_reporter.out; then echo 'UNEXPECTED_REPORTER_CATEGORY'; exit 1; fi
          echo 'CLASSIFIED_REPORTER_NEGATIVE_CONTROL_PASSED'
      - name: Verify real GitHub OIDC signature and claim schema (never print token)
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const request=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          request.searchParams.set('audience','uag-owner-receipts-v1');
          const response=await fetch(request,{headers:{Authorization:'bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},signal:AbortSignal.timeout(12000)});
          if(!response.ok)throw Error('OIDC_FETCH_'+response.status);
          const jwt=(await response.json()).value;
          const parts=jwt.split('.');
          if(parts.length!==3)throw Error('JWT_PARTS');
          const header=JSON.parse(Buffer.from(parts[0],'base64url').toString('utf8'));
          const claims=JSON.parse(Buffer.from(parts[1],'base64url').toString('utf8'));
          if(header.alg!=='RS256'||header.typ!=='JWT'||!header.kid)throw Error('JWT_HEADER_SHAPE_MISMATCH');
          const j=await fetch('https://token.actions.githubusercontent.com/.well-known/jwks',{signal:AbortSignal.timeout(12000)});
          if(!j.ok)throw Error('JWKS_HTTP_'+j.status);
          const keys=(await j.json()).keys;
          const key=keys.find(v=>v.kid===header.kid&&v.kty==='RSA'&&v.alg==='RS256'&&v.use==='sig'&&v.n&&v.e);
          if(!key)throw Error('JWKS_KEY_NO_MATCH');
          const publicKey=await crypto.subtle.importKey('jwk',{kty:'RSA',n:key.n,e:key.e,alg:'RS256',ext:true},{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['verify']);
          const signature=Buffer.from(parts[2],'base64url');
          const signedData=new TextEncoder().encode(parts[0]+'.'+parts[1]);
          if(!await crypto.subtle.verify('RSASSA-PKCS1-v1_5',publicKey,signature,signedData))throw Error('JWT_SIGNATURE_INVALID');
          if(!Number.isSafeInteger(claims.iat)||!Number.isSafeInteger(claims.exp)||typeof claims.run_id!=='string')throw Error('JWT_CLAIMS_SHAPE_MISMATCH');
          console.log('REAL_GITHUB_OIDC_CRYPTO_AND_SCHEMA_PASSED');
          JS
