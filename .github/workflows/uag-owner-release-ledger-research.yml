# Offline only. No Cloudflare/GitHub deploy credentials, production migrations or
# provisioned owner signing material. Research lane is intentionally disposable.
name: UAG Owner Release Ledger Research
on:
  push:
    branches:
      - research/uag-release-ledger-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trusted-ledger-fixture:
    if: ${{ github.event.repository.private == false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real SQLite contention and crash-consumed revision tests
        run: python -m unittest discover -s cloud_host -p test_owner_release_ledger.py -v
      - name: Signed artifact validation and replay ledger integration
        run: node --test cloud_host/owner_release_verifier.test.mjs cloud_host/owner_release_guard.test.mjs
      - name: Existing disposable owner signature regressions
        run: node --test cloud_host/owner_policy_vault.test.mjs

  upload-only-dry-run:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Wrangler only in disposable CI runner
        run: npm install --no-save --ignore-scripts wrangler@4.158.0
      - name: Verify upload-only Worker version compilation (no credentials, no deployment)
        run: npx wrangler versions upload --dry-run --config cloud_host/wrangler.d1.pending.toml
