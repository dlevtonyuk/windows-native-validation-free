# CI-only, no deployment, owner activation, credentials or provider writes.
name: UAG final-quorum cross-OS inert research
on:
  push:
    branches: [research/uag-owner-isolated-release-20261112]
    paths:
      - '.github/workflows/uag-final-quorum-cross-os-research.yml'
      - 'research/inert_witness/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uag-inert-witness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inert-witness-tests:
    if: ${{ github.event.repository.private == false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: ''
      - name: Install pinned cryptography dependency in disposable runner
        run: python -m pip install --disable-pip-version-check --no-cache-dir cryptography==46.0.4
      - name: Verify source digests and run exactly twelve inert tests
        working-directory: research/inert_witness
        run: python run_portable.py
